name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew compileJava -q || true
      - name: inspect
        run: |
          find ~/.gradle .gradle -name "*.jar" 2>/dev/null | grep -i minecraft | head -30
          JAR=$(find ~/.gradle .gradle -name "*.jar" 2>/dev/null | grep -i "minecraft" | grep -iE "client|merged" | grep -v sources | head -1)
          echo "JAR=$JAR"
          for c in net.minecraft.client.renderer.GameRenderer net.minecraft.world.scores.Scoreboard net.minecraft.server.ServerScoreboard net.minecraft.world.scores.ScoreHolder net.minecraft.world.scores.ScoreAccess net.minecraft.world.scores.PlayerTeam net.minecraft.world.scores.TeamColor; do
            echo "=== $c"; javap -cp "$JAR" $c 2>&1 | grep -iE "fov|Objective|addObjective|setDisplay|getOrCreate|forNameOnly|set\(|setColor|class|enum| [A-Z_]+;" | head -40
          done
          echo "=== zombie"; unzip -l "$JAR" | grep -E "Zombie.class|/Husk.class" | head
          echo "=== gamerules"; unzip -l "$JAR" | grep -iE "GameRules.class|gamerules/" | head -20
          echo "=== hud"; find ~/.gradle -name "*.jar" | grep -i "fabric-rendering-v1" | head -3
