name: smoke
on: [pull_request, push]

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./ci/smoke-server.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log

  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: sudo apt-get update -q && sudo apt-get install -yq xvfb mesa-utils libgl1-mesa-dri > /dev/null
      - run: chmod +x ./gradlew && ./ci/smoke-client.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-log
          path: client.log
